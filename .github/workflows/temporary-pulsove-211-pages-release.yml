name: TEMP publish vetted 211-service PulsoVE demo
on:
  push:
    branches: ['release/pulsove-211-illustrative-charts-20261112']
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.repository == 'medinacaj/web-downdetector-ve'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure this release uses exactly merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "1760d06b2907e93d39be56f96901ef0f44f65182"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify catalogue and local mark files
        run: npx vitest run tests/seed-data.test.ts tests/global-platforms.test.ts tests/home-brand-logos.test.ts
      - name: Build and inspect public synthetic-only preview
        run: |
          GITHUB_SHA=1760d06b2907e93d39be56f96901ef0f44f65182 npx tsx scripts/build-pages-global-demo.mjs
          node scripts/check-pages-global-demo.mjs
          grep -q 'catalogue=211' pages-global-demo/build-info.txt
          grep -q 'Ejemplo visual · datos simulados' pages-global-demo/index.html
          grep -q 'data-report=' pages-global-demo/servicios/index.html
      - name: Update existing gh-pages branch atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/pulsove-v3-preview refs/remotes/origin/gh-pages
          git -C /tmp/pulsove-v3-preview rm -r -q --ignore-unmatch -- .
          cp -a pages-global-demo/. /tmp/pulsove-v3-preview/
          git -C /tmp/pulsove-v3-preview add -A
          git -C /tmp/pulsove-v3-preview diff --cached --check
          git -C /tmp/pulsove-v3-preview config user.name 'github-actions[bot]'
          git -C /tmp/pulsove-v3-preview config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/pulsove-v3-preview commit -m 'deploy(demo): 211 services, synthetic sparklines and red compact report icon'
          git -C /tmp/pulsove-v3-preview push origin HEAD:refs/heads/gh-pages
          echo 'Published DEMO ONLY; does not accept real reports and does not claim any service outages.' >> "$GITHUB_STEP_SUMMARY"
