name: One-time Zod 4.6.7 lockfile regeneration
on:
  push:
    branches: [fix/security-zod-4-6-7-20261112]
    paths: ['.github/workflows/zod-lock-refresh-temp.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/security-zod-4-6-7-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate real npm lockfile for patched Zod
        run: npm install zod@4.6.7 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify version in both manifests
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          const l=JSON.parse(readFileSync('package-lock.json','utf8'));
          if(p.dependencies.zod!=='4.6.7'||l.packages[''].dependencies.zod!=='4.6.7'||l.packages['node_modules/zod']?.version!=='4.6.7') throw Error('Zod 4.6.7 lock regeneration failed');
          if(l.packages['node_modules/next']?.version!=='16.4.1')throw Error('Next critical patch regressed');
          console.log('Zod lock verified at 4.6.7; Next.js still at 16.4.1');
          NODE
      - name: Push only generated manifests to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'Lockfile did not change'; exit 1; }
          git commit -m "fix(security): upgrade Zod to 4.6.7 and regenerate npm lock"
          git push origin HEAD:fix/security-zod-4-6-7-20261112
