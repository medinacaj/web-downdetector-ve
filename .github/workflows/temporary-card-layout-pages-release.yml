name: TEMP publish verified PulsoVE card layout demo
on:
  push:
    branches: ['release/pulsove-card-layout-toolbar-20261112']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'medinacaj/web-downdetector-ve'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin release to exact main integration commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "c197b5fd8491256c9473f1895a1ec5991087ed67"
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Check catalogue and brand integrity
        run: npx vitest run tests/seed-data.test.ts tests/global-platforms.test.ts tests/home-brand-logos.test.ts
      - name: Rebuild and validate Pages output
        run: |
          GITHUB_SHA=c197b5fd8491256c9473f1895a1ec5991087ed67 npx tsx scripts/build-pages-global-demo.mjs
          node scripts/check-pages-global-demo.mjs
          grep -q 'catalogue=211' pages-global-demo/build-info.txt
          grep -q 'grid-auto-rows:1fr' pages-global-demo/index.html
          grep -q 'card-actions' pages-global-demo/index.html
          grep -q '.card\[hidden\]{display:none!important}' pages-global-demo/index.html
      - name: Publish only reviewed static preview to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/pulsove-card-layout-pages refs/remotes/origin/gh-pages
          git -C /tmp/pulsove-card-layout-pages rm -r -q --ignore-unmatch -- .
          cp -a pages-global-demo/. /tmp/pulsove-card-layout-pages/
          git -C /tmp/pulsove-card-layout-pages add -A
          git -C /tmp/pulsove-card-layout-pages diff --cached --check
          git -C /tmp/pulsove-card-layout-pages config user.name 'github-actions[bot]'
          git -C /tmp/pulsove-card-layout-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/pulsove-card-layout-pages commit -m 'deploy(demo): aligned responsive cards with full-width plots from c197b5f'
          git -C /tmp/pulsove-card-layout-pages push origin HEAD:refs/heads/gh-pages
          echo 'Demo-only GitHub Pages publication; no incidents, API calls or real reports.' >> "$GITHUB_STEP_SUMMARY"
