name: TEMP publish PulsoVE logo and report UX demo
on:
  push:
    branches: ['release/quick-report-pages-20261112']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'medinacaj/web-downdetector-ve'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin published source to exact merged main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "8f8720efa25538433e6a7b0d9e3e591eac6d8bb4"
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify catalogue and local logo integrity
        run: npx vitest run tests/seed-data.test.ts tests/global-platforms.test.ts tests/home-brand-logos.test.ts
      - name: Generate and validate static demonstration
        run: |
          GITHUB_SHA="$(git merge-base HEAD origin/main)" npx tsx scripts/build-pages-global-demo.mjs
          node scripts/check-pages-global-demo.mjs
          grep -q "logo\[hidden\]" pages-global-demo/index.html
          grep -q "data-report=" pages-global-demo/servicios/index.html
          grep -q "no envía ni almacena reportes" pages-global-demo/index.html
      - name: Publish only vetted preview files to existing gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/pulsove-pages-preview refs/remotes/origin/gh-pages
          git -C /tmp/pulsove-pages-preview rm -r -q --ignore-unmatch -- .
          cp -a pages-global-demo/. /tmp/pulsove-pages-preview/
          git -C /tmp/pulsove-pages-preview add -A
          git -C /tmp/pulsove-pages-preview diff --cached --check
          git -C /tmp/pulsove-pages-preview config user.name 'github-actions[bot]'
          git -C /tmp/pulsove-pages-preview config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/pulsove-pages-preview commit -m 'deploy(demo): logo priority and quick reporting preview from 8f8720e'
          git -C /tmp/pulsove-pages-preview push origin HEAD:refs/heads/gh-pages
          echo 'Static demo only — no reports sent or backend deployed.' >> "$GITHUB_STEP_SUMMARY"
