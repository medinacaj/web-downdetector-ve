name: Security patch - Next.js 16.4.1 branch only
on:
  push:
    branches:
      - fix/security-next-16-4-1-20261112
    paths:
      - .github/workflows/next-security-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.ref == 'refs/heads/fix/security-next-16-4-1-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate with npm registry (no install scripts)
        run: |
          npm install next@16.4.1 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update sharp source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert minimum secure locked versions
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const v=(name)=>lock.packages['node_modules/'+name]?.version;
          const atLeast=(value,minimum)=>{
            if (!value) return false;
            const a=value.split('.').map(Number),b=minimum.split('.').map(Number);
            for(let i=0;i<3;i++){if(a[i]>b[i])return true;if(a[i]<b[i])return false}
            return true;
          };
          if (pkg.dependencies.next !== '16.4.1' || lock.packages[''].dependencies.next !== '16.4.1' || v('next') !== '16.4.1') throw Error('Next.js must be pinned and locked at 16.4.1');
          if (!atLeast(v('sharp'),'0.35.5')) throw Error('sharp must be at least 0.35.5');
          if (!atLeast(v('source-map-js'),'1.2.2')) throw Error('source-map-js must be at least 1.2.2');
          console.log('Verified:',{next:v('next'),sharp:v('sharp'),sourceMap:v('source-map-js')});
          NODE
      - name: Commit only package manifests to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "No package changes produced"; exit 1; fi
          git commit -m "fix(security): pin patched Next.js 16.4.1 with npm-generated lock"
          git push origin HEAD:fix/security-next-16-4-1-20261112
      - name: Install from lock (without lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
