name: Home service cards — checks and PostgreSQL build
on:
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/components/home/**'
      - 'src/lib/queries/home.ts'
      - 'src/lib/queries/home-trends.ts'
      - 'src/lib/favorites.ts'
      - 'src/lib/brand-logos.ts'
      - 'src/lib/db/seed-data/**'
      - 'public/brands/**'
      - 'scripts/build-pages-global-demo.mjs'
      - 'scripts/check-pages-global-demo.mjs'
      - 'tests/global-pages-browser.py'
      - 'tests/global-platforms.test.ts'
      - 'tests/home-*.test.ts'
      - 'tests/home-cards-browser.py'
      - '.github/workflows/home-cards-ci.yml'
  push:
    branches: [main, 'feat/home-service-pulse-cards-20261112', 'feat/global-platforms-catalog-20261112']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsove_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pulsove_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulsove_ci
      ANONYMIZATION_SALT: CI_ONLY_NO_REAL_USERS_2345678901234567890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Run unit and component logic tests
        run: npm run test:unit
      - name: Initialize temporary PostgreSQL
        run: |
          npm run db:migrate:deploy
          npm run db:seed
      - name: Run API integration tests
        run: npm run test:integration
      - name: Build mobile activity index with actual seeded database
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium smoke test
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify homepage responsive cards in Chrome
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/pulsove-home.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          python tests/home-cards-browser.py
      - name: Store actual mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pulsove-home-mobile-preview
          path: artifacts/pulsove-home-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Generate worldwide static preview from canonical seed data
        run: npx tsx scripts/build-pages-global-demo.mjs
      - name: Verify global preview safety, assets and script syntax
        run: node scripts/check-pages-global-demo.mjs
      - name: Verify static GitHub Pages directory in browser
        run: |
          mkdir -p /tmp/pulsove-public/web-downdetector-ve
          cp -a pages-global-demo/. /tmp/pulsove-public/web-downdetector-ve/
          python -m http.server 3434 --directory /tmp/pulsove-public >/tmp/pulsove-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3434/web-downdetector-ve/ >/dev/null; then break; fi
            sleep 1
          done
          python tests/global-pages-browser.py
      - name: Store worldwide demo bundle for release
        uses: actions/upload-artifact@v4
        with:
          name: pulsove-worldwide-gh-pages
          path: pages-global-demo/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Store international catalogue browser previews
        uses: actions/upload-artifact@v4
        with:
          name: pulsove-global-mobile-screenshots
          path: artifacts/global-pages-*.png
          if-no-files-found: error
          retention-days: 7

