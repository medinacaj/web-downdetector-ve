name: PulsoVE calidad de rutas
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: pulsove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pulsove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci_test_only@localhost:5432/pulsove_test
      ANONYMIZATION_SALT: CI_UNIT_TEST_ONLY_NOT_FOR_REAL_TRAFFIC_1234567890
      ENABLE_TURNSTILE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Avisos de dependencias incluidas las herramientas (bloquea high/critical)
        run: npm run audit:dependencies
      - run: npm run check:standards
      - run: npm run typecheck
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Pruebas unitarias e integración con PostgreSQL aislado
        run: npm test
      - name: Instalación limpia y rechazo de migración incompatible (bases temporales locales)
        run: npm run smoke:migrations
