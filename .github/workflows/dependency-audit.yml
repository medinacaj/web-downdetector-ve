name: Auditoría periódica de dependencias
on:
  schedule:
    - cron: '15 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Leer avisos de dependencias de producción
        run: npm audit --json --omit=dev > dependency-audit.json || true
      - name: Resumir avisos y fallar ante riesgos altos o críticos
        env:
          FAIL_ON_HIGH: 'true'
        run: node scripts/report-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 21
