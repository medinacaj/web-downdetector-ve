name: Auditoría periódica de dependencias
on:
  schedule:
    - cron: '15 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Leer avisos de dependencias de producción
        run: npm audit --json --omit=dev > dependency-audit.json || true
      - name: Leer avisos de dependencias incluyendo herramientas de desarrollo
        run: npm audit --json > dependency-audit-all.json || true
      - name: Resumir avisos completos sin bloquear por dependencias de desarrollo
        env:
          AUDIT_SCOPE: all
          FAIL_ON_HIGH: 'false'
        run: node scripts/report-dependencies.mjs dependency-audit-all.json
      - name: Resumir avisos y fallar ante riesgos altos o críticos
        env:
          FAIL_ON_HIGH: 'true'
        run: node scripts/report-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-audit-all.json
          retention-days: 21
