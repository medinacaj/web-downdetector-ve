name: Auditoría periódica de dependencias
on:
  schedule:
    - cron: '15 10 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/report-dependencies.mjs'
      - 'scripts/production-audit-report.mjs'
      - 'tests/production-audit-report.test.mjs'
      - '.github/workflows/dependency-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verificar formato del informe con casos sintéticos
        run: node --test tests/production-audit-report.test.mjs
      - name: Leer avisos de dependencias de producción
        run: npm audit --json --omit=dev > dependency-audit.json || true
      - name: Resumir severidades (sin declarar explotación)
        run: node scripts/report-dependencies.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 21
