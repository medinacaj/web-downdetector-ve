name: PulsoVE — ensayo aislado de backup y restauración
on:
  pull_request:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'src/lib/db/schema.ts'
      - 'scripts/ci-verify-backup-restore.mjs'
      - '.github/workflows/db-recovery-ci.yml'
      - 'scripts/seed.ts'
      - 'tests/api-reports.test.ts'
      - 'tests/api-comments.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsove_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pulsove_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulsove_ci
      ANONYMIZATION_SALT: SYNTHETIC_CI_ONLY_RESTORE_TEST_NEVER_REAL_USERS_1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply versioned migrations to isolated PostgreSQL
        run: npm run db:migrate:deploy
      - name: Seed demonstration catalogue
        run: npm run db:seed
      - name: Reapply migrations to verify idempotent history
        run: npm run db:migrate:deploy
      - name: Exercise report/comment routes with synthetic data
        run: npm run test:integration
      - name: Verify backup and isolated restore without exposing rows
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          ALLOW_SYNTHETIC_RESTORE_TEST: "1"
        run: node scripts/ci-verify-backup-restore.mjs
