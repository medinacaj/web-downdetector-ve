name: Secretos en Git
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks 8.30.1 con checksum fijado
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/pulsove-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          cd "$tool_dir"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Revisar historial completo disponible
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact=100 --ignore-gitleaks-allow --no-banner \
            --log-opts='--all --full-history' \
            --report-format json --report-path "$RUNNER_TEMP/pulsove-history.json" .
      - name: Revisar todos los archivos de la revisión publicada por Git
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d "$RUNNER_TEMP/pulsove-snapshot.XXXXXX")
          trap 'rm -rf "$snapshot"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          gitleaks dir --redact=100 --ignore-gitleaks-allow --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/pulsove-snapshot.json" "$snapshot"
